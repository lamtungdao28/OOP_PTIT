spring.application.name=oopPTIT
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:oop-ptit}
app.jwt.audience=${JWT_AUDIENCE:oop-ptit-api}
app.jwt.ttl=${JWT_TTL:15m}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.docs.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
app.ai.base-url=${AI_SERVICE_URL:http://127.0.0.1:8000}
app.ai.token=${AI_SERVICE_TOKEN:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
